<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intrusion Detection Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/dashboard.css">  
</head>
<body>
    <div class="hamburger" onclick="toggleSidebar(this)">
        <div></div>
        <div></div>
        <div></div>
    </div>
    
    <!-- Sidebar -->
    <div class="sidebar">
       
        <h3>System Dashboard</h3>
        <ul class="list-unstyled components">
            <li class="{{ 'active' if request.endpoint == 'dashboard' }}">
                <a href="{{ url_for('dashboard') }}"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            </li>
            <li class="{{ 'active' if request.endpoint == 'attack' }}">
                <a href="{{ url_for('attack') }}"><i  class="fas fa-eye"></i>Detect Attack</a>
            </li>
            <li class="{{ 'active' if request.endpoint == 'alerts' }}">
                <a href="{{ url_for('alerts') }}"><i class="fas fa-bell"></i>Alerts</a>
            </li>
            <li class="{{ 'active' if request.endpoint == 'statistics' }}">
                <a href="{{ url_for('statistics') }}"><i class="fas fa-chart-line"></i> statistics</a>
            </li>
            
            <li class="{{ 'active' if request.endpoint == 'logs' }}">
                <a href="{{ url_for('logs') }}"><i class="fas fa-shield-alt"></i>Security Logs</a>
            </li>
            <li class="{{ 'active' if request.endpoint == 'settings' }}">
                <a href="{{ url_for('settings') }}"><i class="fas fa-cog"></i> Settings</a>
            </li>
            <li class="{{ 'active' if request.endpoint == 'logout' }}">
                <a href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </li>
        </ul>
        <!-- <ul class="list-unstyled">
            <li><a href="#" class="active"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a></li>
            <li><a href="#"><i class="fas fa-eye"></i> <span>Detect Attack</span></a></li>
            <li><a href="#"><i class="fas fa-bell"></i> <span>Alerts</span></a></li>
            <li><a href="#"><i class="fas fa-chart-line"></i> <span>Statistics</span></a></li>
            <li><a href="#"><i class="fas fa-shield-alt"></i> <span>Security Logs</span></a></li>
            <li><a href="#"><i class="fas fa-cogs"></i> <span>Settings</span></a></li>
        </ul> -->
    </div>
    <!-- Page Content -->
    <div class="dashboard-content">
        {% block content %}{% endblock %}
    </div>
</nav>

<script>
    function toggleSidebar(el) {
        el.classList.toggle("active");
        document.querySelector(".sidebar").classList.toggle("show");
    }
</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
