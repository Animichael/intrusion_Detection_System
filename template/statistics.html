{% extends "base_dashboard.html" %}

{% block content %}
<!-- Content Area -->
<div class="content">
    <!-- Navbar -->
    <nav class="navbar">
        <a class="navbar-brand" href="#" style="color:#00d4ff;">Statistics</a>
    </nav>

    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Statistics</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: transparent;
            color: #2c3e50;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            margin-bottom: 20px;
            text-align: center;
        }
        
        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .time-filter {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .time-btn {
            background: #f8f9fa;
            color: #2c3e50;
            border: 1px solid #dee2e6;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .time-btn.active {
            background: #FF6B35;
            font-weight: bold;
        }
        
        .time-btn:hover {
            background: #e9ecef;
            border-color: #adb5bd;
        }
        
        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
            margin-bottom: 40px;
            background: #ffffff;
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .stat-card {
            background: #ffffff;
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #FF6B35;
            margin: 10px 0;
        }
        
        .stat-label {
            font-size: 1rem;
            opacity: 0.7;
            color: #2c3e50;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
        }
        
        .loading i {
            color: #FF6B35;
            font-size: 2rem;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .chart-container {
                height: 300px;
                padding: 10px;
            }
            
            .stats-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .time-filter {
                width: 100%;
            }
            
            .time-btn {
                flex-grow: 1;
                text-align: center;
            }
        }
        
        @media (max-width: 480px) {
            .chart-container {
                height: 250px;
            }
            
            .stat-value {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-chart-line" style="color:#FF6B35"></i> Security Statistics</h1>
        
        <div class="stats-header">
            <h2>Monthly Attack Trends</h2>
            <div class="time-filter">
                <button class="time-btn active" onclick="loadData('3months')">3 Months</button>
                <button class="time-btn" onclick="loadData('6months')">6 Months</button>
                <button class="time-btn" onclick="loadData('12months')">12 Months</button>
                <button class="time-btn" onclick="loadData('all')">All Time</button>
            </div>
        </div>
        
        <div class="chart-container">
            <canvas id="attackChart"></canvas>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Attacks</div>
                <div class="stat-value" id="totalAttacks">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">High Severity</div>
                <div class="stat-value" id="highSeverity">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Most Common</div>
                <div class="stat-value" id="commonAttack">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Last 30 Days</div>
                <div class="stat-value" id="lastMonth">0</div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>© 2025 Advanced IDS - All Rights Reserved</p>
    </div>
    <script>
        let attackChart;
        const ctx = document.getElementById('attackChart').getContext('2d');
        
        // Initialize with empty chart
        initializeChart();
        
        // Load initial data (last 3 months)
        document.addEventListener('DOMContentLoaded', () => {
            loadData('3months');
        });
        
        function initializeChart() {
            attackChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Attacks Detected',
                        data: [],
                        borderColor: '#FF6B35',
                        backgroundColor: 'rgba(255, 107, 53, 0.1)',
                        borderWidth: 3,
                        tension: 0.3,
                        fill: true,
                        pointBackgroundColor: '#FF6B35',
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(0, 0, 0, 0.1)'
                            },
                            ticks: {
                                color: '#2c3e50'
                            }
                        },
                        x: {
                            grid: {
                                color: 'rgba(0, 0, 0, 0.1)'
                            },
                            ticks: {
                                color: '#2c3e50'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: {
                                color: '#2c3e50',
                                font: {
                                    size: 14
                                }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(255, 255, 255, 0.95)',
                            titleColor: '#FF6B35',
                            bodyColor: '#2c3e50',
                            borderColor: '#FF6B35',
                            borderWidth: 1
                        }
                    }
                }
            });
        }
        
        function loadData(range) {
            // Set active button
            document.querySelectorAll('.time-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Show loading state
            const canvas = document.getElementById('attackChart');
            canvas.style.display = 'none';
            const loading = document.createElement('div');
            loading.className = 'loading';
            loading.innerHTML = '<i class="fas fa-spinner"></i>';
            canvas.parentNode.insertBefore(loading, canvas);
            
            fetch(`/get_attack_stats?range=${range}`)
                .then(response => response.json())
                .then(data => {
                    // Remove loading
                    canvas.style.display = 'block';
                    loading.remove();
                    
                    // Update chart
                    attackChart.data.labels = data.months;
                    attackChart.data.datasets[0].data = data.counts;
                    attackChart.update();
                    
                    // Update stats cards
                    document.getElementById('totalAttacks').textContent = data.total_attacks;
                    document.getElementById('highSeverity').textContent = data.high_severity;
                    document.getElementById('commonAttack').textContent = data.most_common || '-';
                    document.getElementById('lastMonth').textContent = data.last_month;
                })
                .catch(error => {
                    console.error('Error loading stats:', error);
                    loading.innerHTML = '<p>Error loading data. Please try again.</p>';
                });
        }
    </script>
</body>
</html>
   
    
</div>
{% endblock %}
